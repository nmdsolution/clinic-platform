# version: "3.7"

services:
  gateway:
    build:
      context: ./gateway
    environment:
      # Assistant IA : à renseigner dans le .env du serveur (pas dans le dépôt)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}

  frontend:
    build:
      context: .
      dockerfile: frontend/overlay.Dockerfile

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
