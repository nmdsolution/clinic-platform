services:
  gateway:
    build:
      context: ./gateway
    restart: "unless-stopped"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  frontend:
    build:
      context: ./frontend/custom-modules/esm-caisse-app
      dockerfile: overlay.Dockerfile
      args:
        BASE_FRONTEND_TAG: ${TAG:-3.7.1}
    restart: "unless-stopped"
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
      SPA_DEFAULT_LOCALE:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-qa}
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_healthy
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 8m
    volumes:
      - openmrs-data:/openmrs/data

  # Module Caisse & Facturation (Clinique FACE) - microservice Python
  caisse:
    build:
      context: ./backend/services/caisse
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      CAISSE_DB_HOST: db
      CAISSE_DB_NAME: face_caisse
      CAISSE_DB_USER: ${OMRS_DB_USER:-openmrs}
      CAISSE_DB_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      CAISSE_DB_ROOT_USER: root
      CAISSE_DB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
      CAISSE_JWT_SECRET: ${CAISSE_JWT_SECRET:-changeme-en-production-avec-une-vraie-cle-secrete}
      CAISSE_ADMIN_USERNAME: ${CAISSE_ADMIN_USERNAME:-admin}
      CAISSE_ADMIN_PASSWORD: ${CAISSE_ADMIN_PASSWORD:-ChangeMoi123!}
      CAISSE_OPENMRS_BASE_URL: http://backend:8080/openmrs
      CAISSE_OPENMRS_USERNAME: ${OPENMRS_ADMIN_USERNAME:-admin}
      CAISSE_OPENMRS_PASSWORD: ${OPENMRS_ADMIN_PASSWORD:-Admin123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  # MariaDB
  db:
    image: mariadb:10.11.7
    restart: "unless-stopped"
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    healthcheck:
      test: "mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - db-data:/var/lib/mysql

volumes:
  openmrs-data: ~
  db-data: ~
